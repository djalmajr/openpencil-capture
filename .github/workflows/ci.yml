name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run verify
      - run: bun run smoke:iframe
      - run: bun run smoke:extension-iframe
      # Every change must package; every build of main can be downloaded and loaded by hand.
      - name: Package extension
        run: bun run package:ext
      # The artifact is itself a ZIP, so it holds the extension's files, not a ZIP inside a ZIP.
      - name: Upload extension build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: openpencil-capture-extension
          path: dist/extension/
          if-no-files-found: error
