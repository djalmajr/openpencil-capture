name: Release extension

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Package and publish extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - id: extension
        name: Validate tag, version, and notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid extension tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          manifest_version="$(bun -e 'console.log(JSON.parse(await Bun.file("extension/manifest.json").text()).version)')"
          package_version="$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')"
          if [[ "$version" != "$manifest_version" || "$version" != "$package_version" ]]; then
            echo "Tag $version, manifest $manifest_version, and package $package_version must match" >&2
            exit 1
          fi
          notes="extension/releases/$version.md"
          if [[ ! -s "$notes" ]]; then
            echo "Missing extension release notes: $notes" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME must point to a commit on main" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
      - name: Test and build
        run: bun run verify
      - name: Test the loaded extension
        run: |
          bun run smoke:iframe
          bun run smoke:extension-iframe
      - name: Package Store-ready extension
        run: bun run package:ext -- --expected-version "${{ steps.extension.outputs.version }}"
      - name: Checksum
        working-directory: artifacts
        run: sha256sum "openpencil-capture-${{ steps.extension.outputs.version }}.zip" > "openpencil-capture-${{ steps.extension.outputs.version }}.zip.sha256"
      - name: Publish extension release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.extension.outputs.notes }}
          VERSION: ${{ steps.extension.outputs.version }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "artifacts/openpencil-capture-$VERSION.zip"
          "artifacts/openpencil-capture-$VERSION.zip.sha256"
          --notes-file "$NOTES"
          --title "OpenPencil Capture $VERSION"
          --verify-tag
